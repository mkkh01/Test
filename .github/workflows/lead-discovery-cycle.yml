name: Lead discovery cycle

on:
  schedule:
    # Every 30 minutes, offset from the busy top/bottom of the hour.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: lead-discovery-cycle
  cancel-in-progress: false

jobs:
  trigger-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger protected Render cycle
        env:
          CRON_TRIGGER_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_TRIGGER_SECRET" ]; then
            echo "CRON_TRIGGER_SECRET is not configured in GitHub repository secrets."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 \
            --output /tmp/cron-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CRON_TRIGGER_SECRET}" \
            --header 'Accept: application/json' \
            https://test-p2h3.onrender.com/api/internal/cron/run)
          cat /tmp/cron-response.json
          if [ "$status" != "202" ]; then
            echo "Unexpected Render cron response: HTTP $status"
            exit 1
          fi
          echo "Render accepted the cycle trigger with HTTP 202."
